# # apiVersion: rbac.authorization.k8s.io/v1
# # kind: ClusterRole
# # metadata:
# #   name: cluster-admin
# # rules:
# #   - apiGroups: ["*"]
# #     resources: ["*"]
# #     verbs: ["*"]

# ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin-binding
subjects:
  - kind: Group
    name: brandstori-devops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-reader
rules:
  - apiGroups: ["*"]
    resources:
      [
        "deployments",
        "pods",
        "services",
        "configmaps",
        "ingresses",
        "replicasets",
        "statefulsets",
        "daemonsets",
        "jobs",
        "cronjobs",
        "persistentvolumeclaims",
        "persistentvolumes",
      ]
    verbs: ["get", "list", "watch", "describe", "logs"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reader-binding
subjects:
  - kind: Group
    name: brandstori-prod-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-reader
  apiGroup: rbac.authorization.k8s.io
